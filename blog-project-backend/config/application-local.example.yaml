# 复制为 config/application-local.yaml 后填写真实值。
# application-local.yaml 已被 .gitignore 忽略，请勿提交真实密钥。
spring:
  datasource:
    password: CHANGE_ME_MYSQL_PASSWORD
  data:
    redis:
      # 本地 Redis 没有密码时保留空字符串。
      password: ""

app:
  security:
    jwt:
      # 填入 Base64 编码、解码后至少 32 字节的随机密钥。
      secret-base64: CHANGE_ME_BASE64_SECRET
  media:
    # local 可直接联调；切换 aliyun-oss 后填写下面的 OSS 配置。
    storage-provider: local
    local-root: media-uploads
    public-base-url: http://localhost:8080/media
    oss:
      endpoint: ${OSS_ENDPOINT:}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      bucket-name: ${OSS_BUCKET_NAME:}
  search:
    # Elasticsearch 本地单节点默认无账号；如开启安全认证则填写用户名和密码。
    base-url: http://localhost:9200
    username: ""
    password: ""
    index-alias: binspace-posts
  ai:
    # 填写任意兼容 /v1/chat/completions 的大模型服务，不要提交真实 API Key。
    base-url: CHANGE_ME_OPENAI_COMPATIBLE_BASE_URL
    chat-completions-path: /v1/chat/completions
    api-key: CHANGE_ME_AI_API_KEY
    model: CHANGE_ME_AI_MODEL

# 将来接入第三方服务时，API Key 也只放在本地文件或环境变量中，例如：
# integrations:
#   provider:
#     api-key: ${PROVIDER_API_KEY:CHANGE_ME_LOCAL_ONLY}
