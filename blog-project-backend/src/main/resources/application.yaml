spring:
  application:
    name: blog-project-backend

  profiles:
    # 本地默认读取项目根目录 config/application-local.yaml；部署时必须显式指定生产 profile。
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/binspace?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    # 主配置只保留占位；local profile 的真实值来自被 Git 忽略的外部配置。
    password: ${DB_PASSWORD:${app.db.password}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      # 本机 Redis 无密码时允许为空；部署环境通过 REDIS_PASSWORD 注入。
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_FILE_SIZE:200MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:205MB}

app:
  security:
    jwt:
      issuer: binspace
      access-token-ttl: 2h
      # 不提供默认 Secret，防止部署时误用公开的开发密钥。
      secret-base64: ${JWT_SECRET_BASE64}
  media:
    # 本地开发默认写入 media-uploads；生产设置为 aliyun-oss。
    storage-provider: ${MEDIA_STORAGE_PROVIDER:local}
    local-root: ${MEDIA_LOCAL_ROOT:media-uploads}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8080/media}
    max-image-bytes: ${MEDIA_MAX_IMAGE_BYTES:10485760}
    max-video-bytes: ${MEDIA_MAX_VIDEO_BYTES:209715200}
    max-audio-bytes: ${MEDIA_MAX_AUDIO_BYTES:31457280}
    retry-enabled: ${MEDIA_RETRY_ENABLED:true}
    retry-delay-ms: ${MEDIA_RETRY_DELAY_MS:60000}
    oss:
      endpoint: ${OSS_ENDPOINT:}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      bucket-name: ${OSS_BUCKET_NAME:}
  realtime:
    sse-timeout-ms: ${SSE_TIMEOUT_MS:1800000}
    heartbeat-ms: ${SSE_HEARTBEAT_MS:25000}
    replay-limit: ${SSE_REPLAY_LIMIT:100}
    redis-channel: ${SSE_REDIS_CHANNEL:binspace:realtime:notifications}
  search:
    base-url: ${ELASTICSEARCH_URL:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    index-alias: ${ELASTICSEARCH_INDEX_ALIAS:binspace-posts}
    reindex-batch-size: ${ELASTICSEARCH_REINDEX_BATCH_SIZE:200}
  ai:
    # 支持 OpenAI-compatible /v1/chat/completions；密钥只由本地配置或环境变量注入。
    base-url: ${AI_BASE_URL:}
    chat-completions-path: ${AI_CHAT_COMPLETIONS_PATH:/v1/chat/completions}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    context-post-limit: ${AI_CONTEXT_POST_LIMIT:5}
    max-context-characters: ${AI_MAX_CONTEXT_CHARACTERS:12000}
    requests-per-minute: ${AI_REQUESTS_PER_MINUTE:10}
  post:
    # 单实例 V1 定时发布轮询间隔；条件更新保证同一文章只会成功发布一次。
    schedule-check-ms: ${POST_SCHEDULE_CHECK_MS:30000}
  rate-limit:
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:10}
    register-per-hour: ${RATE_LIMIT_REGISTER_PER_HOUR:5}
    interaction-per-minute: ${RATE_LIMIT_INTERACTION_PER_MINUTE:12}
    like-per-minute: ${RATE_LIMIT_LIKE_PER_MINUTE:60}
    media-upload-per-minute: ${RATE_LIMIT_MEDIA_UPLOAD_PER_MINUTE:20}
    search-per-minute: ${RATE_LIMIT_SEARCH_PER_MINUTE:60}

server:
  port: 8080
