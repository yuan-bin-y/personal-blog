        payload: { type: object, additionalProperties: true, description: 与对应 Create/Update DTO 的可编辑字段相同 }
        baseVersion: { type: integer, minimum: 0, example: 3 }
    AutosaveVO:
      type: object
      required: [postId, savedAt, baseVersion]
      properties:
        postId: { $ref: '#/components/schemas/BigIntId' }
        savedAt: { type: string, format: date-time }
        baseVersion: { type: integer, minimum: 0 }
    AutosaveResponse:
      allOf:
        - { $ref: '#/components/schemas/ApiSuccessBase' }
        - type: object
          required: [data]
          properties: { data: { $ref: '#/components/schemas/AutosaveVO' } }
    PostVersionVO:
      type: object
      required: [id, postId, versionNo, summary, createdAt]
      properties:
        id: { $ref: '#/components/schemas/BigIntId' }
        postId: { $ref: '#/components/schemas/BigIntId' }
        versionNo: { type: integer, minimum: 1 }
        summary: { type: string, maxLength: 200 }
        createdAt: { type: string, format: date-time }
    PostVersionDetailVO:
      allOf:
        - { $ref: '#/components/schemas/PostVersionVO' }
        - type: object
          required: [type, snapshot]
          properties:
            type: { type: string, enum: [TECH, MOMENT] }
            snapshot: { type: object, additionalProperties: true, description: 保存时的完整可编辑字段快照 }
    PostVersionPageVO:
      type: object
      required: [items, page, pageSize, total, totalPages, hasMore]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PostVersionVO' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 50 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
    PostVersionPageResponse:
      allOf:
        - { $ref: '#/components/schemas/ApiSuccessBase' }
        - type: object
          required: [data]
          properties: { data: { $ref: '#/components/schemas/PostVersionPageVO' } }
    PostVersionDetailResponse:
      allOf:
        - { $ref: '#/components/schemas/ApiSuccessBase' }
        - type: object
          required: [data]
          properties: { data: { $ref: '#/components/schemas/PostVersionDetailVO' } }
    RestoreVersionDTO:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 0, example: 5 }
    BatchPostItemDTO:
      type: object
      required: [postId, version]
      properties:
        postId: { $ref: '#/components/schemas/BigIntId' }
        version: { type: integer, minimum: 0, example: 3 }
    BatchPostDTO:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/BatchPostItemDTO' }
          example: [{ postId: '1909508401234567168', version: 3 }, { postId: '1909508401234567169', version: 1 }]
    BatchPostFailureVO:
      type: object
      required: [postId, code, message]
      properties:
        postId: { $ref: '#/components/schemas/BigIntId' }
        code: { type: string, example: VERSION_CONFLICT }
        message: { type: string, example: 数据已被修改 }
    BatchPostResultVO:
      type: object
      required: [succeededIds, failed]
      properties:
        succeededIds: { type: array, items: { $ref: '#/components/schemas/BigIntId' } }
        failed: { type: array, items: { $ref: '#/components/schemas/BatchPostFailureVO' } }
    BatchPostResultResponse:
      allOf:
        - { $ref: '#/components/schemas/ApiSuccessBase' }
        - type: object
          required: [data]
          properties: { data: { $ref: '#/components/schemas/BatchPostResultVO' } }
    UpdateSlugDTO:
      type: object
      required: [slug, version]
      properties:
        slug: { type: string, minLength: 1, maxLength: 180, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', example: redis-lua-stock-control }
        version: { type: integer, minimum: 0, example: 3 }
    MarkdownImportVO:
      type: object
      required: [title, content, frontMatter]
      properties:
        title: { type: string, example: Redis + Lua 如何解决库存超卖 }
        content: { type: string, example: '# Redis + Lua\n\n正文...' }
        frontMatter: { type: object, additionalProperties: true, example: { tags: [Redis, Lua] } }
    MarkdownImportResponse:
      allOf:
        - { $ref: '#/components/schemas/ApiSuccessBase' }
        - type: object
          required: [data]
          properties: { data: { $ref: '#/components/schemas/MarkdownImportVO' } }
    PostSummaryResponse:
      allOf:
        - { $ref: '#/components/schemas/ApiSuccessBase' }
        - type: object
          required: [data]
          properties: { data: { $ref: '#/components/schemas/PostSummaryVO' } }
