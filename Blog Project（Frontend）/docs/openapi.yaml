openapi: 3.0.3
info:
  title: BinSpace API
  version: 2.0.0-draft.1
  description: |
    BinSpace 当前 42 个接口基线与下一阶段功能 2～8 契约。
    认证使用 Spring Security、Bearer JWT 和 Redis Token Session。
    新增接口在后端实现前仅代表约定，不代表当前环境已经可调用。
servers:
  - url: http://localhost:8080
    description: Local Spring Boot
tags:
  - name: Auth
    description: Visitor/Owner 身份、JWT 登录与退出
  - name: Site
    description: Visitor 空间初始化
  - name: Owner Site
    description: Owner Profile 与站点配置
  - name: Posts
    description: Visitor 混合内容流
  - name: Tech
    description: Visitor TECH 内容
  - name: Moments
    description: Visitor MOMENT 内容
  - name: Owner Posts
    description: Owner TECH/MOMENT 读取与 CRUD
  - name: Categories
    description: TECH 分类读取与管理
  - name: Tags
    description: TECH 标签读取与管理
  - name: Comments
    description: Post 评论读取与 Owner 管理
  - name: Guestbook
    description: 空间留言读取与 Owner 管理
  - name: Archive
    description: TECH/MOMENT 混合归档
  - name: Visitor Interaction
    description: 登录 Visitor 的评论与留言写操作
  - name: Likes
    description: Post 持久化点赞
  - name: Media
    description: Owner 媒体上传与管理
  - name: Realtime
    description: SSE 与通知中心
  - name: Search
    description: 全文搜索、推荐与 AI 搜索
  - name: Owner Advanced Posts
    description: 定时发布、自动保存、版本、回收站、批量与导入

paths:
  /api/auth/login:
    post:
      summary: Visitor / Owner 登录
      description: 使用用户名和密码登录；角色由服务端账号决定。成功后返回 Access Token，并在 Redis 登记 Token Session。
      tags: [Auth]
      operationId: login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginDTO' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: []

  /api/auth/me:
    get:
      summary: 获取当前身份
      description: 不携带 Token 时返回 VISITOR；携带有效 Bearer Token 时返回 OWNER。
      tags: [Auth]
      operationId: getCurrentIdentity
      parameters: []
      responses:
        '200':
          description: 当前身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: []

  /api/auth/logout:
    post:
      summary: 退出登录
      description: Visitor 或 Owner 撤销当前 JWT 在 Redis 中的 Token Session；客户端随后丢弃本地 Access Token。
      tags: [Auth]
      operationId: logout
      parameters: []
      responses:
        '204': { description: 退出成功，无响应体 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []

  /api/site/bootstrap:
    get:
      summary: 获取空间初始化数据
      description: 一次返回 Site Basic、Profile、Hero、Announcement、Music、Appearance、Page Media 和 External Links；无请求体。
      tags: [Site]
      operationId: getSiteBootstrap
      parameters: []
      responses:
        '200':
          description: 空间初始化数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteBootstrapResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: []

  /api/owner/profile:
    put:
      summary: 更新 Owner Profile
      description: 使用 profile.version 乐观锁，不影响 site_config.version。
      tags: [Owner Site]
      operationId: updateOwnerProfile
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileDTO' }
      responses:
        '200':
          description: 更新后的 Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []

  /api/owner/site/basic:
    put:
      summary: 更新空间基本信息
      description: 更新站点英文名、中文名与说明，使用 site_config 共享 version。
      tags: [Owner Site]
      operationId: updateSiteBasic
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSiteBasicDTO' }
      responses:
        '200':
          description: 更新后的 Basic 与最新共享版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteBasicSectionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []

  /api/owner/site/hero:
    put:
      summary: 更新 Hero
      description: 保存 Hero 文案及 desktop/mobile video/poster URL，使用 site_config 共享 version。
      tags: [Owner Site]
      operationId: updateHero
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateHeroDTO' }
      responses:
        '200':
          description: 更新后的 Hero 与最新共享版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HeroSectionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []

  /api/owner/site/announcement:
    put:
      summary: 更新空间公告
      description: enabled=true 时 content 必须非空；使用 site_config 共享 version。
      tags: [Owner Site]
      operationId: updateAnnouncement
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAnnouncementDTO' }
      responses:
        '200':
          description: 更新后的公告或 null 及最新共享版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementSectionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []

  /api/owner/site/music:
    put:
      summary: 更新空间音乐
      description: audioUrl 为空表示关闭音乐；使用 site_config 共享 version。
      tags: [Owner Site]
      operationId: updateMusic
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMusicDTO' }
      responses:
        '200':
          description: 更新后的音乐或 null 及最新共享版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MusicSectionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []

  /api/owner/site/appearance:
    put:
      summary: 更新默认空间外观
      description: 保存全站默认外观；Visitor 的页面内临时偏好不调用此接口。使用共享 version。
      tags: [Owner Site]
      operationId: updateAppearance
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAppearanceDTO' }
      responses:
        '200':
          description: 更新后的外观与最新共享版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppearanceSectionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []

  /api/owner/site/page-media:
    put:
      summary: 更新页面媒体配置
      description: 保存 Moments、Guestbook、Tech、Archive、About 背景配置，使用共享 version。
      tags: [Owner Site]
      operationId: updatePageMedia
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePageMediaDTO' }
      responses:
        '200':
          description: 更新后的页面媒体与最新共享版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageMediaSectionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []

  /api/posts:
    get:
      summary: 获取首页混合 Feed
      description: 只返回公开的 PUBLISHED TECH/MOMENT；无请求体。
      tags: [Posts]
      operationId: listPublicPosts
      parameters:
        - { $ref: '#/components/parameters/PostTypeQuery' }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PageSizeQuery' }
      responses:
        '200':
          description: 分页 Post 摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: []

  /api/posts/tech:
    get:
      summary: 获取公开 TECH 列表
      description: 支持 Category/Tag slug 筛选，只返回公开文章；无请求体。
      tags: [Tech]
      operationId: listPublicTechPosts
      parameters:
        - { $ref: '#/components/parameters/CategorySlugQuery' }
        - { $ref: '#/components/parameters/TagSlugQuery' }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PageSizeQuery' }
      responses:
        '200':
          description: 分页 TECH 摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: []

  /api/posts/tech/{slug}:
    get:
      summary: 获取公开 TECH 详情
      description: 通过稳定 slug 获取正文、关联元信息和相关文章；无请求体。
      tags: [Tech]
      operationId: getPublicTechPost
      parameters:
        - { $ref: '#/components/parameters/SlugPath' }
      responses:
        '200':
          description: TECH 详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TechDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: []

  /api/posts/moments:
    get:
      summary: 获取公开 MOMENT 列表
      description: 前端按 publishedAt 分月展示；无请求体。
      tags: [Moments]
      operationId: listPublicMoments
      parameters:
        - { $ref: '#/components/parameters/YearQuery' }
        - { $ref: '#/components/parameters/MonthQuery' }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PageSizeQuery' }
      responses:
        '200':
          description: 分页 MOMENT 摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: []

  /api/posts/moments/{id}:
    get:
      summary: 获取公开 MOMENT 详情
      description: MOMENT 不返回标题、摘要、分类和阅读时间；无请求体。
      tags: [Moments]
      operationId: getPublicMoment
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: MOMENT 详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MomentDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: []

  /api/archive:
    get:
      summary: 获取公开归档
      description: 按时间返回 TECH/MOMENT 混合归档；无请求体。
      tags: [Archive]
      operationId: getPublicArchive
      parameters:
        - { $ref: '#/components/parameters/YearQuery' }
        - { $ref: '#/components/parameters/PostTypeQuery' }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PageSizeQuery' }
      responses:
        '200':
          description: 分页归档
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchiveResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: []

  /api/owner/posts:
    get:
      summary: 获取 Owner 内容列表
      description: 可读取 DRAFT/PUBLISHED，供刷新后恢复草稿；无请求体。
      tags: [Owner Posts]
      operationId: listOwnerPosts
      parameters:
        - { $ref: '#/components/parameters/PostTypeQuery' }
        - { $ref: '#/components/parameters/PostStatusQuery' }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PageSizeQuery' }
      responses:
        '200':
          description: Owner 分页内容，包含 status/version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []

  /api/owner/posts/tech:
    post:
      summary: 创建 TECH
      description: 服务端生成 id、slug、readingTime、时间和互动计数；正文图片 URL 保存在 content。
      tags: [Owner Posts]
      operationId: createTechPost
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTechPostDTO' }
      responses:
        '201':
          description: 创建后的 TECH
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TechDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []

  /api/owner/posts/tech/{id}:
    get:
      summary: Owner 按 ID 获取 TECH
      description: 可读取 DRAFT/PUBLISHED，返回 status/version；无请求体。
      tags: [Owner Posts]
      operationId: getOwnerTechPost
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: Owner TECH 编辑详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TechDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
    put:
      summary: 更新 TECH
      description: 完整替换可编辑字段；标题变化不修改 slug，必须携带 version。
      tags: [Owner Posts]
      operationId: updateTechPost
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTechPostDTO' }
      responses:
        '200':
          description: 更新后的 TECH
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TechDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
    delete:
      summary: 删除 TECH
      description: 使用 id + version 逻辑删除；不使用 ETag/If-Match；无请求体。
      tags: [Owner Posts]
      operationId: deleteTechPost
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { $ref: '#/components/parameters/VersionQuery' }
      responses:
        '204': { description: 删除成功，无响应体 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []

  /api/owner/posts/moments:
    post:
      summary: 创建 MOMENT
      description: MOMENT 只接收 content、images、status，不接收 TECH 专属字段。
      tags: [Owner Posts]
      operationId: createMoment
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMomentDTO' }
      responses:
        '201':
          description: 创建后的 MOMENT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MomentDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []

  /api/owner/posts/moments/{id}:
    get:
      summary: Owner 按 ID 获取 MOMENT
      description: 可读取 DRAFT/PUBLISHED，返回 status/version；无请求体。
      tags: [Owner Posts]
      operationId: getOwnerMoment
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          description: Owner MOMENT 编辑详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MomentDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
    put:
      summary: 更新 MOMENT
      description: 完整替换 content/images/status，必须携带 version。
      tags: [Owner Posts]
      operationId: updateMoment
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMomentDTO' }
      responses:
        '200':
          description: 更新后的 MOMENT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MomentDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []
    delete:
      summary: 删除 MOMENT
      description: 使用 id + version 逻辑删除；不使用 ETag/If-Match；无请求体。
      tags: [Owner Posts]
      operationId: deleteMoment
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { $ref: '#/components/parameters/VersionQuery' }
      responses:
        '204': { description: 删除成功，无响应体 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security:
        - bearerAuth: []

  /api/categories:
    get:
      summary: 获取公开分类
      description: 只返回 active 分类；used=true 时仅返回被公开 TECH 使用的分类；无请求体。
      tags: [Categories]
      operationId: listPublicCategories
      parameters:
        - { $ref: '#/components/parameters/UsedQuery' }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PageSizeQuery' }
      responses:
        '200':
          description: 分页分类
          content:
            application/json:
