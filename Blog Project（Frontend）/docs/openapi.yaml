        label: { type: string, nullable: true, maxLength: 64, example: 空间状态 }
        text: { type: string, nullable: true, maxLength: 255, example: 正在写 BinSpace }
        emoji: { type: string, nullable: true, maxLength: 32, example: ☕ }

    ProfileStatsVO:
      type: object
      required: [techPostCount, momentCount, guestbookCount]
      properties:
        techPostCount: { type: integer, minimum: 0, example: 6 }
        momentCount: { type: integer, minimum: 0, example: 9 }
        guestbookCount: { type: integer, minimum: 0, example: 7 }

    ProfileVO:
      type: object
      required: [id, userId, name, avatar, role, bio, status, stats, version, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/BigIntId' }
        userId: { $ref: '#/components/schemas/BigIntId' }
        name: { type: string, example: 玢 }
