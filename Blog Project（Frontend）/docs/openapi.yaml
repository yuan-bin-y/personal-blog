        mobile: { type: string, nullable: true, example: /media/pages/home-beyond-mountain-mobile.jpg }

    AppearanceVO:
      type: object
      required: [layoutMode, backgroundMode, surfaceOpacity, backdropShade, wallpaper, allowVisitorControls]
      properties:
        layoutMode: { type: string, enum: [standard, immersive], example: standard }
        backgroundMode: { type: string, enum: [video, wallpaper], example: wallpaper }
        surfaceOpacity: { type: number, format: double, minimum: 0, maximum: 1, example: 0.54 }
        backdropShade: { type: number, format: double, minimum: 0, maximum: 1, example: 0.3 }
