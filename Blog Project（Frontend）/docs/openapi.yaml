        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [{ bearerAuth: [] }]

  /api/realtime/events:
    get:
      summary: 订阅实时通知
      description: SSE 长连接；HTTP 仍负责评论和留言写入。支持 Last-Event-ID 断线续传。
      tags: [Realtime]
      operationId: subscribeRealtimeEvents
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: SSE 事件流，event 为通知类型，data 为 NotificationVO JSON
          content:
            text/event-stream:
              schema: { type: string, example: "id: 190000000000000001\nevent: COMMENT_CREATED\ndata: {\"id\":\"190000000000000001\"}\n\n" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [{ bearerAuth: [] }]

  /api/notifications:
    get:
      summary: 获取通知列表
      description: 用于首次加载和 SSE 断线补偿。
      tags: [Realtime]
      operationId: listNotifications
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema: { type: boolean, default: false }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PageSizeQuery' }
      responses:
        '200':
          description: 通知分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [{ bearerAuth: [] }]

  /api/notifications/{notificationId}/read:
    put:
      summary: 标记通知已读
      description: 仅通知接收者可以操作。
      tags: [Realtime]
      operationId: markNotificationRead
      parameters:
        - { $ref: '#/components/parameters/NotificationIdPath' }
      responses:
        '200':
          description: 更新后的通知
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [{ bearerAuth: [] }]

  /api/notifications/read-all:
    put:
      summary: 全部通知标记已读
      description: 将当前用户所有未读通知标记为已读，返回剩余未读数。
      tags: [Realtime]
      operationId: markAllNotificationsRead
      parameters: []
      responses:
        '200':
          description: 剩余未读数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadCountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [{ bearerAuth: [] }]

  /api/search:
    get:
      summary: 搜索公开内容
      description: 搜索 Elasticsearch 中的公开 TECH/MOMENT，绝不返回草稿或软删除内容。
      tags: [Search]
      operationId: searchPublishedPosts
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
          example: Redis Lua
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [ALL, TECH, MOMENT], default: ALL }
        - { $ref: '#/components/parameters/CategorySlugQuery' }
        - { $ref: '#/components/parameters/TagSlugQuery' }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PageSizeQuery' }
      responses:
        '200':
          description: 搜索结果分页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResultPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: []

  /api/posts/{postId}/related:
    get:
      summary: 获取相关内容
      description: 按分类、标签、类型和时间衰减推荐公开内容，不使用个人画像。
      tags: [Search]
      operationId: listRelatedPosts
      parameters:
        - { $ref: '#/components/parameters/PostIdPath' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 10, default: 4 }
      responses:
        '200':
          description: 相关 Post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: []

  /api/search/ai:
    post:
      summary: AI 内容问答
      description: 只使用已发布 BinSpace 内容作为检索上下文，并返回来源；接口需要限流。
      tags: [Search]
      operationId: askPublishedContent
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiSearchDTO' }
      responses:
        '200':
          description: 带来源的回答
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSearchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: []

  /api/owner/search/reindex:
    post:
      summary: 创建全文索引重建任务
      description: 异步重建公开内容索引；已有运行中任务时返回 409。
      tags: [Search]
      operationId: createSearchReindexTask
      parameters: []
      responses:
        '202':
          description: 任务已接受
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReindexTaskResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ResourceConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [{ bearerAuth: [] }]

  /api/owner/search/reindex/{taskId}:
    get:
      summary: 获取索引重建状态
      description: 返回异步重建任务的当前状态。
      tags: [Search]
      operationId: getSearchReindexTask
      parameters:
        - { $ref: '#/components/parameters/TaskIdPath' }
      responses:
        '200':
          description: 重建任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReindexTaskResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [{ bearerAuth: [] }]

  /api/owner/posts/{postId}/schedule:
    put:
      summary: 设置定时发布
      description: 将 Post 置为 SCHEDULED；发布时间必须晚于当前时间，并使用 Post version 乐观锁。
      tags: [Owner Advanced Posts]
      operationId: schedulePost
      parameters:
        - { $ref: '#/components/parameters/PostIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchedulePostDTO' }
      responses:
        '200': { description: 已设置定时发布, content: { application/json: { schema: { $ref: '#/components/schemas/PostSummaryResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [{ bearerAuth: [] }]
    delete:
      summary: 取消定时发布
      description: 将 SCHEDULED Post 恢复为 DRAFT，version 通过 Query 明确传递。
      tags: [Owner Advanced Posts]
      operationId: cancelScheduledPost
      parameters:
        - { $ref: '#/components/parameters/PostIdPath' }
        - { $ref: '#/components/parameters/VersionQuery' }
      responses:
        '200': { description: 已取消定时发布, content: { application/json: { schema: { $ref: '#/components/schemas/PostSummaryResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [{ bearerAuth: [] }]

  /api/owner/posts/{postId}/autosave:
    put:
      summary: 自动保存编辑内容
      description: 保存独立草稿快照，不覆盖正式 Post；baseVersion 不匹配时返回 409。
      tags: [Owner Advanced Posts]
      operationId: autosavePost
      parameters:
        - { $ref: '#/components/parameters/PostIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutosavePostDTO' }
      responses:
        '200': { description: 自动保存成功, content: { application/json: { schema: { $ref: '#/components/schemas/AutosaveResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [{ bearerAuth: [] }]

  /api/owner/posts/{postId}/versions:
    get:
      summary: 获取 Post 历史版本
      description: 分页返回正式保存产生的历史版本摘要。
      tags: [Owner Advanced Posts]
      operationId: listPostVersions
      parameters:
        - { $ref: '#/components/parameters/PostIdPath' }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PageSizeQuery' }
      responses:
        '200': { description: 历史版本分页, content: { application/json: { schema: { $ref: '#/components/schemas/PostVersionPageResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [{ bearerAuth: [] }]

  /api/owner/posts/{postId}/versions/{versionId}:
    get:
      summary: 获取历史版本详情
      description: 返回指定 Post 的某个历史快照，不能跨 Post 读取。
      tags: [Owner Advanced Posts]
      operationId: getPostVersion
      parameters:
        - { $ref: '#/components/parameters/PostIdPath' }
        - { $ref: '#/components/parameters/VersionIdPath' }
      responses:
        '200': { description: 历史版本详情, content: { application/json: { schema: { $ref: '#/components/schemas/PostVersionDetailResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [{ bearerAuth: [] }]

  /api/owner/posts/{postId}/versions/{versionId}/restore:
    post:
      summary: 恢复历史版本
      description: 先保存当前快照，再把指定历史版本恢复到 Post；使用当前 Post version 乐观锁。
      tags: [Owner Advanced Posts]
      operationId: restorePostVersion
      parameters:
        - { $ref: '#/components/parameters/PostIdPath' }
        - { $ref: '#/components/parameters/VersionIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreVersionDTO' }
      responses:
        '200': { description: 恢复后的 Post, content: { application/json: { schema: { $ref: '#/components/schemas/PostSummaryResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [{ bearerAuth: [] }]

  /api/owner/posts/trash:
    get:
      summary: 获取回收站
      description: 分页返回 Owner 已软删除的 TECH/MOMENT。
      tags: [Owner Advanced Posts]
      operationId: listTrashedPosts
      parameters:
        - { $ref: '#/components/parameters/PostTypeQuery' }
        - { $ref: '#/components/parameters/PageQuery' }
        - { $ref: '#/components/parameters/PageSizeQuery' }
      responses:
        '200': { description: 回收站分页, content: { application/json: { schema: { $ref: '#/components/schemas/PostPageResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [{ bearerAuth: [] }]

  /api/owner/posts/{postId}/restore:
    post:
      summary: 恢复回收站 Post
      description: 将软删除内容恢复为 DRAFT；关联唯一资源冲突时返回 409。
      tags: [Owner Advanced Posts]
      operationId: restoreTrashedPost
      parameters:
        - { $ref: '#/components/parameters/PostIdPath' }
        - { $ref: '#/components/parameters/VersionQuery' }
      responses:
        '200': { description: 恢复后的 Post, content: { application/json: { schema: { $ref: '#/components/schemas/PostSummaryResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [{ bearerAuth: [] }]

  /api/owner/posts/batch/publish:
    post:
      summary: 批量发布 Post
      description: 逐项发布；单项失败不回滚其他成功项，响应列出每项结果。
      tags: [Owner Advanced Posts]
      operationId: batchPublishPosts
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchPostDTO' }
      responses:
        '200': { description: 批量处理结果, content: { application/json: { schema: { $ref: '#/components/schemas/BatchPostResultResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [{ bearerAuth: [] }]

  /api/owner/posts/batch/delete:
    post:
      summary: 批量软删除 Post
      description: 逐项软删除；单项失败不回滚其他成功项。
      tags: [Owner Advanced Posts]
      operationId: batchDeletePosts
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchPostDTO' }
      responses:
        '200': { description: 批量处理结果, content: { application/json: { schema: { $ref: '#/components/schemas/BatchPostResultResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [{ bearerAuth: [] }]

  /api/owner/posts/tech/{id}/slug:
    put:
      summary: 修改 TECH slug
      description: 修改 slug 并执行唯一约束与乐观锁校验。
      tags: [Owner Advanced Posts]
      operationId: updateTechSlug
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSlugDTO' }
      responses:
        '200': { description: 更新后的 TECH, content: { application/json: { schema: { $ref: '#/components/schemas/TechDetailResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [{ bearerAuth: [] }]

  /api/owner/posts/import/markdown:
    post:
      summary: 解析 Markdown 文件
      description: 仅解析为编辑器预览数据，不直接创建或发布文章。
      tags: [Owner Advanced Posts]
      operationId: importMarkdown
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: 解析结果, content: { application/json: { schema: { $ref: '#/components/schemas/MarkdownImportResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
      security: [{ bearerAuth: [] }]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "登录/注册接口返回的 JWT Access Token。Visitor 与 Owner 受保护请求均使用 Authorization: Bearer <token>。"

  parameters:
    PageQuery:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSizeQuery:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
    IdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/BigIntId' }
    PostIdPath:
      name: postId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/BigIntId' }
    CommentIdPath:
      name: commentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/BigIntId' }
    EntryIdPath:
      name: entryId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/BigIntId' }
    SlugPath:
      name: slug
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 180 }
      example: redis-lua-stock-control
    VersionQuery:
      name: version
      in: query
      required: true
      schema: { type: integer, minimum: 0 }
      example: 3
    PostTypeQuery:
      name: type
      in: query
      required: false
      schema: { type: string, enum: [ALL, TECH, MOMENT], default: ALL }
    PostStatusQuery:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [ALL, DRAFT, SCHEDULED, PUBLISHED], default: ALL }
    CategorySlugQuery:
      name: category
      in: query
      required: false
      schema: { type: string }
      example: redis
    TagSlugQuery:
      name: tag
      in: query
      required: false
      schema: { type: string }
      example: lua
    YearQuery:
      name: year
      in: query
      required: false
      schema: { type: integer, minimum: 1970, maximum: 9999 }
      example: 2026
    MonthQuery:
      name: month
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 12 }
      example: 9
    UsedQuery:
      name: used
      in: query
      required: false
      schema: { type: boolean }
      description: true 时仅返回被公开 TECH 使用的项目。
    ActiveStatusQuery:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [ACTIVE, DISABLED, ALL], default: ALL }
    MediaIdPath:
      name: mediaId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/BigIntId' }
    NotificationIdPath:
      name: notificationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/BigIntId' }
    VersionIdPath:
      name: versionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/BigIntId' }
    TaskIdPath:
      name: taskId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }

  responses:
    BadRequest:
      description: 请求参数或 Bean Validation 失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: BAD_REQUEST, message: 请求参数不正确, data: { title: 标题不能为空 }, traceId: 01JEXAMPLE }
    Unauthorized:
      description: 未携带 Token、JWT 无效/过期，或 Redis Token Session 已失效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: AUTH_REQUIRED, message: 请先登录, data: null, traceId: 01JEXAMPLE }
    AuthFailed:
      description: 用户名或密码错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: AUTH_FAILED, message: 用户名或密码错误, data: null, traceId: 01JEXAMPLE }
    Forbidden:
      description: 当前 JWT 身份缺少接口要求的角色或权限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: FORBIDDEN, message: 无权执行此操作, data: null, traceId: 01JEXAMPLE }
    NotFound:
      description: 资源不存在、已删除或不可见
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: RESOURCE_NOT_FOUND, message: 资源不存在, data: null, traceId: 01JEXAMPLE }
    VersionConflict:
      description: 乐观锁版本冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: VERSION_CONFLICT, message: 数据已被修改, data: null, traceId: 01JEXAMPLE }
    ResourceConflict:
      description: 唯一键、重复回复或资源状态冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: RESOURCE_CONFLICT, message: 资源状态冲突, data: null, traceId: 01JEXAMPLE }
    Conflict:
      description: 乐观锁、唯一键或资源状态冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            version:
              value: { code: VERSION_CONFLICT, message: 数据已被修改, data: null, traceId: 01JEXAMPLE }
            resource:
              value: { code: RESOURCE_CONFLICT, message: 资源状态冲突, data: null, traceId: 01JEXAMPLE }
    InternalError:
      description: 未处理的服务端错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: INTERNAL_ERROR, message: 服务暂时不可用, data: null, traceId: 01JEXAMPLE }
    PayloadTooLarge:
      description: 上传文件超过服务端限制
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: PAYLOAD_TOO_LARGE, message: 文件大小超过限制, data: null, traceId: 01JEXAMPLE }
    UnsupportedMediaType:
      description: 文件真实媒体类型不受支持
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: UNSUPPORTED_MEDIA_TYPE, message: 不支持该文件类型, data: null, traceId: 01JEXAMPLE }
    RateLimited:
      description: 请求过于频繁
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: RATE_LIMITED, message: 请求过于频繁，请稍后再试, data: null, traceId: 01JEXAMPLE }
    UpstreamError:
      description: AI 或搜索上游服务暂时不可用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: UPSTREAM_ERROR, message: 上游服务暂时不可用, data: null, traceId: 01JEXAMPLE }

  schemas:
    NullOnly:
      type: object
      nullable: true
      enum: [null]
      description: OpenAPI 3.0 中供 anyOf 复用的 null 分支。

    BigIntId:
      type: string
      pattern: '^[0-9]+$'
      description: MySQL BIGINT 的十进制字符串，禁止在前端转换为 Number。
      example: '1909508401234567168'

    ApiSuccessBase:
      type: object
      required: [code, message, traceId]
      properties:
        code: { type: string, enum: [OK], example: OK }
        message: { type: string, example: success }
        traceId: { type: string, example: 01JEXAMPLE }

    ErrorResponse:
      type: object
      required: [code, message, data, traceId]
      properties:
        code:
          type: string
          enum: [BAD_REQUEST, AUTH_REQUIRED, AUTH_FAILED, FORBIDDEN, RESOURCE_NOT_FOUND, VERSION_CONFLICT, RESOURCE_CONFLICT, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, RATE_LIMITED, UPSTREAM_ERROR, INTERNAL_ERROR]
        message: { type: string }
        data:
          type: object
          nullable: true
          additionalProperties: true
        traceId: { type: string }

    OwnerLoginDTO:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, format: password, minLength: 1, maxLength: 128, writeOnly: true }
      example: { username: owner, password: change-me }

    OwnerLoginVO:
      type: object
      required: [accessToken, tokenType, expiresIn, identity]
      properties:
        accessToken:
          type: string
          description: JWT Access Token。客户端仅保存 Token 本体，不包含 Bearer 前缀。
          example: eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJiaW5zcGFjZSJ9.signature
        tokenType: { type: string, enum: [Bearer], example: Bearer }
        expiresIn:
          type: integer
          format: int64
          description: Access Token 剩余有效秒数。
          example: 7200
        identity: { $ref: '#/components/schemas/IdentityVO' }

    IdentityUserVO:
      type: object
      required: [id, username, displayName, avatar]
      properties:
        id: { $ref: '#/components/schemas/BigIntId' }
        username: { type: string, example: owner }
        displayName: { type: string, example: 玢 }
        avatar: { type: string, nullable: true, example: /media/avatar.jpg }

    IdentityVO:
      type: object
      required: [authenticated, role, user, permissions]
      properties:
        authenticated: { type: boolean, example: true }
        role: { type: string, enum: [VISITOR, OWNER], example: OWNER }
        user:
          anyOf:
            - { $ref: '#/components/schemas/IdentityUserVO' }
            - { $ref: '#/components/schemas/NullOnly' }
        permissions:
          type: array
          items: { type: string }
          example: [POST_CREATE, POST_EDIT, POST_DELETE, PROFILE_EDIT, SITE_EDIT]

    OwnerLoginResponse:
      allOf:
        - { $ref: '#/components/schemas/ApiSuccessBase' }
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/OwnerLoginVO' }

    IdentityResponse:
      allOf:
        - { $ref: '#/components/schemas/ApiSuccessBase' }
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/IdentityVO' }

    SiteBasicVO:
      type: object
      required: [name, chineseName, description]
      properties:
        name: { type: string, example: BinSpace }
        chineseName: { type: string, example: 玢的空间 }
        description: { type: string, nullable: true, example: 记录代码，也记录生活。 }

    ProfileStatusVO:
      type: object
      required: [label, text, emoji]
      properties:
        label: { type: string, nullable: true, example: 空间状态 }
        text: { type: string, nullable: true, example: 正在写 BinSpace }
        emoji: { type: string, nullable: true, example: ☕ }

    UpdateProfileStatusDTO:
