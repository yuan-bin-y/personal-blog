        heroSubtitle: { type: string, nullable: true, example: 这里收录认真写下的技术文章，也收藏日常时刻。 }
        desktopVideo: { type: string, nullable: true, example: /media/binspace-hero.mp4 }
        mobileVideo: { type: string, nullable: true, example: /media/binspace-hero-mobile.mp4 }
        poster: { type: string, nullable: true, example: /media/binspace-hero.jpg }

    AnnouncementVO:
      type: object
      required: [content, enabled]
      properties:
        content: { type: string, example: 欢迎来到玢的空间。 }
        enabled: { type: boolean, example: true }

    MusicVO:
      type: object
